<text x="340" y="478" text-anchor="middle" font-family="'Helvetica Neue', 'Inter', system-ui, sans-serif" font-size="68" font-weight="700" fill="#f8fafc" letter-spacing="8" style="fill:rgb(248, 250, 252);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Helvetica Neue&quot;, Inter, system-ui, sans-serif;font-size:68px;font-weight:700;text-anchor:middle;dominant-baseline:auto">AGRE</text>

<text x="340" y="538" text-anchor="middle" font-family="'Helvetica Neue', 'Inter', system-ui, sans-serif" font-size="22" font-weight="400" fill="#64748b" letter-spacing="16" style="fill:rgb(100, 116, 139);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Helvetica Neue&quot;, Inter, system-ui, sans-serif;font-size:22px;font-weight:400;text-anchor:middle;dominant-baseline:auto">A G E N C Y</text>

<circle cx="206" cy="615" r="2" fill="#10b981" opacity="0.7" style="fill:rgb(16, 185, 129);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.7;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<text x="340" y="620" text-anchor="middle" font-family="'Helvetica Neue', system-ui, sans-serif" font-size="12" font-weight="400" fill="#475569" letter-spacing="6" style="fill:rgb(71, 85, 105);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Helvetica Neue&quot;, system-ui, sans-serif;font-size:12px;font-weight:400;text-anchor:middle;dominant-baseline:auto">WEB DEVELOPMENT · FRANCE</text>
<circle cx="474" cy="615" r="2" fill="#06b6d4" opacity="0.7" style="fill:rgb(6, 182, 212);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.7;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
